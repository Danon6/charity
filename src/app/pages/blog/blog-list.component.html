<div class="max-w-2xl mx-auto p-4 space-y-4">
  <!-- Sticky Post Input -->
  <div class="sticky top-0 z-10 bg-white shadow-md rounded-2xl p-4">
    <form (ngSubmit)="submitPost()" class="space-y-3">
      <input
        [(ngModel)]="newPost.title"
        name="title"
        placeholder="What's on your mind?"
        class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        required
      />
      <textarea
        [(ngModel)]="newPost.content"
        name="content"
        placeholder="Write more..."
        rows="3"
        class="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      ></textarea>
      <button
        type="submit"
        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl w-full"
      >
        Post
      </button>
    </form>
  </div>

  <!-- Posts Feed -->
  <div *ngFor="let p of posts" class="bg-white p-4 rounded-2xl shadow-md space-y-2 mt-10">
    <h3 class="text-lg font-semibold text-gray-800">{{ p.title }}</h3>
    <p class="text-sm text-gray-700">{{ p.content?.substring(0, 150) }}…</p>
    <div class="text-xs text-gray-500">
      By {{ p.authorName }} • {{ p.publishedDate | date:'mediumDate' }}
    </div>
    <a [routerLink]="[p.id]" class="text-indigo-600 hover:underline text-sm">Read more</a>
  </div>
</div>
